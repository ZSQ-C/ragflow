<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地记账</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">💰 本地记账</h1>
            <p class="text-gray-500 mt-2">数据存储在浏览器本地，安全可靠</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">📝 新增记录</h2>
                    <form id="addForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">类型</label>
                            <select id="type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="expense">支出</option>
                                <option value="income">收入</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                            <select id="category" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">金额</label>
                            <input type="number" id="amount" step="0.01" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="0.00">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">日期</label>
                            <input type="date" id="date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div class="sm:col-span-2 lg:col-span-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                            <input type="text" id="note" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="添加备注...">
                        </div>
                        <div class="sm:col-span-2 lg:col-span-4">
                            <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 transition-colors font-medium">
                                添加记录
                            </button>
                        </div>
                    </form>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-gray-800">📋 最近记录</h2>
                        <button id="clearAll" class="text-sm text-red-500 hover:text-red-600">清空所有数据</button>
                    </div>
                    <div id="recordsList" class="space-y-3 max-h-96 overflow-y-auto scrollbar-hide"></div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">📊 本月统计</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-green-50 rounded-lg p-4">
                            <div class="text-sm text-gray-500">本月收入</div>
                            <div class="text-xl font-bold text-green-600">¥<span id="monthIncome">0.00</span></div>
                        </div>
                        <div class="bg-red-50 rounded-lg p-4">
                            <div class="text-sm text-gray-500">本月支出</div>
                            <div class="text-xl font-bold text-red-600">¥<span id="monthExpense">0.00</span></div>
                        </div>
                        <div class="bg-blue-50 rounded-lg p-4 col-span-2">
                            <div class="text-sm text-gray-500">本月结余</div>
                            <div class="text-xl font-bold text-blue-600">¥<span id="monthBalance">0.00</span></div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">📈 收支图表</h2>
                    <div class="flex justify-center mb-4">
                        <select id="chartPeriod" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm">
                            <option value="month">本月</option>
                            <option value="year">本年</option>
                        </select>
                    </div>
                    <div class="h-64">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">🏷️ 分类统计</h2>
                    <div class="h-48">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
